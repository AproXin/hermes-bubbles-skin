name: verify

# CI verification gate:
# Installs Chromium browser via Playwright and executes test suites.
# 30 headless browser visual suites run against the bundled renderer CSS fixture.
# 25 repo-local static/audit/sync suites run offline.
#
# Suite execution boundaries:
# Two suites require the private Hermes host source checkout:
#   - test/host-selector-drift.test.js (requires the host's desktop sources)
#   - test/skin-css-budget.test.js (requires the host's Python skin engine)
# In isolated CI without host private source, these 2 suites cannot verify contracts.
# Their skips are acknowledged, never silent, and only because both the label and the
# printed reason are declared in scripts/run-tests.js; a third suite that skips — or
# either of these two skipping for any other reason — still fails the gate. The local
# pre-push hook (scripts/git-hooks/pre-push) is the primary gate ensuring all 57/57
# suites pass against the live host checkout. CI permits neither silent skips nor weak
# passes.

on:
  push:
  pull_request:

# Least privilege. This workflow only checks out the repo and runs the suites; it
# never writes to the repo, uploads artifacts or comments on the PR, and it uses no
# secrets. Pinned explicitly so a future default-token change cannot widen it silently.
permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Declare host-dependent suites boundary
        # Explicit declaration of suites requiring host private source (Requirement 4).
        shell: bash
        run: |
          echo "========================================================================"
          echo "CI Execution Boundary Declaration:"
          echo "  - 30 headless browser visual suites are enabled via Playwright Chromium."
          echo "  - 25 repo-local suites run against repository sources."
          echo "  - 2 suites require the private host checkout:"
          echo "      1. test/host-selector-drift.test.js (requires the host's desktop sources)"
          echo "      2. test/skin-css-budget.test.js (requires the host's Python skin engine)"
          echo "    These 2 suites are strictly enforced locally via pre-push."
          echo "    On a runner without that checkout they stand aside: scripts/run-tests.js"
          echo "    prints each one by name and reason as an acknowledged skip (exit 0),"
          echo "    while any other skip still fails the run with exit code 2."
          echo "========================================================================"

      - name: Run verification suites
        # pipefail matters: `node … | tee` would otherwise report tee's status and a
        # failing suite would pass CI. A skip is rejected with exit code 2 unless it is
        # one of the two declared host-dependent stand-asides, which the runner reports
        # by name and reason and counts on a machine-readable "acknowledged" line.
        shell: bash
        run: set -euo pipefail; node scripts/run-tests.js | tee run-tests.log

      - name: Strict verification gate check
        shell: bash
        run: |
          set -euo pipefail
          passed=$(grep -oE '[0-9]+ passed' run-tests.log | head -1 | cut -d' ' -f1)
          failed=$(grep -oE '[0-9]+ failed' run-tests.log | head -1 | cut -d' ' -f1)
          skipped=$(grep -oE '[0-9]+ skipped' run-tests.log | head -1 | cut -d' ' -f1)
          # The two host-dependent suites cannot verify anything without the private
          # checkout, and the runner declares them on this line. Absent the line the
          # count is 0, so an older runner cannot slip skips past this gate.
          acknowledged=$(grep -oE 'host-dependent skips acknowledged [0-9]+' run-tests.log | grep -oE '[0-9]+$' | head -1)
          acknowledged=${acknowledged:-0}
          unverified=$((skipped - acknowledged))
          echo "Suites run summary: $passed passed, $failed failed, $skipped skipped ($acknowledged host-dependent, acknowledged)"
          if [ "$failed" -gt 0 ]; then
            echo "CI Gate FAILED: $failed suites failed" >&2
            exit 1
          fi
          if [ "$unverified" -gt 0 ]; then
            echo "CI Gate FAILED: $unverified suites skipped — only the 2 declared host-dependent suites may stand aside" >&2
            exit 1
          fi

      - name: The run must leave the repo byte-clean
        # sync.js regenerates the tracked artifact plugin.js; byte-identical output is
        # the deploy-idempotency guarantee, so a diff here means a real drift.
        shell: bash
        run: git diff --exit-code
